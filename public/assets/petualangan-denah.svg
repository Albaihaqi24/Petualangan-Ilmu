<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" role="img" aria-labelledby="title desc">
<title id="title">Denah rekaan ruang belajar</title><desc id="desc">Utara ke atas. Dari gerbang di kiri bawah berjalan ke utara sampai taman, lalu ke timur menuju perpustakaan di kanan. Denah tidak berskala.</desc>
<rect width="840" height="400" rx="18" fill="#f3f8ef"/>
<g fill="#fff" stroke="#537c64" stroke-width="3"><rect x="90" y="290" width="170" height="65" rx="10"/><rect x="90" y="130" width="170" height="80" rx="10"/><rect x="530" y="130" width="230" height="80" rx="10"/><rect x="320" y="290" width="180" height="65" rx="10"/></g>
<g stroke="#c38c46" stroke-width="9" fill="none"><path d="M175 290V240V210 M260 170h270"/></g>
<g fill="#c38c46"><path d="m175 220-12 20h24z M515 170l-20-12v24z"/></g>
<path d="M760 95V35m0 0-10 18m10-18 10 18" stroke="#28513d" stroke-width="4" fill="none"/>
<g font-family="sans-serif" fill="#203c2b" text-anchor="middle" font-size="22"><text x="175" y="330">Gerbang</text><text x="175" y="178">Taman</text><text x="645" y="178">Perpustakaan</text><text x="410" y="330">Kelas</text><text x="760" y="25">U</text></g>
<g font-family="sans-serif" fill="#203c2b"><text x="35" y="45" font-size="24">Denah rekaan — tidak berskala</text><text x="35" y="385" font-size="17">Garis jingga: contoh rute. U: utara. Kotak: tempat.</text></g>
</svg>
