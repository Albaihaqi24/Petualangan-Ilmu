<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
<title id="title">Model sederhana jalur air</title><desc id="desc">Matahari memberi energi penguapan dari perairan. Uap mengembun menjadi tetes di awan, hujan turun ke daratan, lalu air mengalir atau meresap. Jalur lain juga mungkin terjadi.</desc>
