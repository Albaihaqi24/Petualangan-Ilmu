<path d="M0 315q180-30 360 0v105H0z" fill="#72b4d7"/><path d="M360 315l170-100 370 100v105H360z" fill="#8dbb7b"/>
<g fill="none" stroke="#305b88" stroke-width="4" marker-end="url(#arrow)"><path d="M210 295V120h215"/><path d="M645 160v100"/><path d="M600 315l-210 40"/><path d="M750 305v80"/></g>
<g font-family="sans-serif" fill="#203c52" font-size="22"><text x="20" y="140">Energi matahari</text><text x="225" y="215">Menguap</text><text x="315" y="95">Mengembun</text><text x="665" y="220">Hujan</text><text x="420" y="375">Mengalir</text><text x="760" y="360">Meresap</text><text x="25" y="405" font-size="17">Model beberapa jalur; air dapat tersimpan, diserap tumbuhan, atau menguap kembali.</text></g>
